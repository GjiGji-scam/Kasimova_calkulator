<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Калькулятор</title>
<style>
  html,body { margin:0; height:100%; background:#000; font-family:sans-serif; }
  .app { height:100%; display:flex; flex-direction:column; padding:12px; gap:10px; }
  #display {
    flex:0 0 22%; background:#1a0d33; border:2px solid #ffd91a; border-radius:20px;
    color:#ffd91a; font-size:8vw; font-weight:700;
    display:flex; align-items:center; justify-content:flex-end; padding:0 18px;
  }
  .grid { flex:1; display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  button {
    border:none; border-radius:50px; font-size:5vw; font-weight:700; color:#fff;
    background:#4a157a;
  }
  button:active { transform: scale(0.94); }
  button.op   { background:#8c26d9; border:2px solid #fff; }
  button.util { background:#ffd91a; color:#000; }
</style>
</head>
<body>
<div class="app">
  <div id="display">0</div>
  <div class="grid" id="grid"></div>
</div>
<script>
  let current='0', prev=null, op=null, reset=false;
  const display = document.getElementById('display');
  const layout = [
    ['C','util'],['±','util'],['%','util'],['÷','op'],
    ['7',''],['8',''],['9',''],['×','op'],
    ['4',''],['5',''],['6',''],['−','op'],
    ['1',''],['2',''],['3',''],['+','op'],
    ['0',''],['.',''],['=','util'],['⌫','util'],
  ];
  layout.forEach(([label, cls]) => {
    const b = document.createElement('button');
    b.textContent = label; b.className = cls;
    b.onclick = () => press(label);
    document.getElementById('grid').appendChild(b);
  });
  function press(l){
    if (/^\d$/.test(l)) { current = (reset||current==='0') ? l : current+l; reset=false; }
    else if (l==='.') { if(!current.includes('.')) current+='.'; }
    else if (l==='C') { current='0'; prev=null; op=null; reset=false; }
    else if (l==='±') { current = current.startsWith('-') ? current.slice(1) : '-'+current; }
    else if (l==='%') { current = String(parseFloat(current)/100); }
    else if (l==='⌫') { current = current.slice(0,-1) || '0'; }
    else if ('+−×÷'.includes(l)) {
      if (op && !reset) calc();
      prev = parseFloat(current); op = l; reset = true;
    }
    else if (l==='=') { calc(); op=null; prev=null; }
    display.textContent = current;
  }
  function calc(){
    if (op===null || prev===null) return;
    const cur = parseFloat(current); let r;
    if (op==='+') r = prev + cur;
    else if (op==='−') r = prev - cur;
    else if (op==='×') r = prev * cur;
    else r = cur===0 ? NaN : prev / cur;
    current = isNaN(r) ? 'Ошибка' : (Number.isInteger(r) ? String(r) : String(+r.toFixed(10)));
    prev = r; reset = true;
  }
</script>
</body>
</html>
